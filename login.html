<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff6a00,#ee0979,#6a11cb,#2575fc);
background-size:400% 400%;
animation:bgmove 12s ease infinite;
overflow:hidden;
}

@keyframes bgmove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

body::before,
body::after{
content:"";
position:absolute;
width:260px;
height:260px;
border-radius:50%;
background:rgba(255,255,255,0.12);
filter:blur(12px);
}

body::before{
top:8%;
left:8%;
}

body::after{
bottom:8%;
right:8%;
}

.box{
position:relative;
z-index:2;
width:420px;
padding:38px;
border-radius:22px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(18px);
box-shadow:0 15px 40px rgba(0,0,0,.28);
text-align:center;
color:white;
animation:fadeup .8s ease;
}

@keyframes fadeup{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;transform:translateY(0);}
}

.box h1{
font-size:34px;
margin-bottom:8px;
letter-spacing:1px;
}

.sub{
font-size:14px;
opacity:.9;
margin-bottom:26px;
}

.input-group{
margin-bottom:16px;
text-align:left;
}

label{
display:block;
font-size:13px;
margin-bottom:6px;
padding-left:4px;
}

input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
font-size:15px;
background:rgba(255,255,255,.20);
color:white;
transition:.3s;
}

input::placeholder{
color:#f2f2f2;
}

input:focus{
background:rgba(255,255,255,.28);
transform:scale(1.01);
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:8px;
background:white;
color:#6a11cb;
transition:.3s;
}

button:hover{
transform:translateY(-2px) scale(1.02);
box-shadow:0 10px 20px rgba(0,0,0,.18);
}

#msg{
margin-top:16px;
min-height:20px;
font-size:14px;
font-weight:bold;
}

.links{
margin-top:18px;
font-size:14px;
}

a{
color:white;
text-decoration:none;
font-weight:bold;
}

a:hover{
text-decoration:underline;
}

.small{
margin-top:16px;
font-size:12px;
opacity:.85;
}
</style>

</head>
<body>

<div class="box">

<h1>Welcome Back ✨</h1>
<div class="sub">Login to continue your premium shopping experience</div>

<div class="input-group">
<label>Email Address</label>
<input type="email" id="email" placeholder="Enter your email">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="password" placeholder="Enter your password">
</div>

<button onclick="login()">Login</button>

<div id="msg"></div>

<div class="links">
Don't have an account?
<a href="register.html">Register</a>
</div>

<div class="small">
🔒 Secure Login • Fast Access • Elegant Experience
</div>

</div>

<script>

const api = "http://localhost:5000";

async function login(){

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value.trim();

const msg = document.getElementById("msg");

if(!email || !password){
msg.style.color="#ffd966";
msg.innerText="Please fill all fields";
return;
}

try{

msg.style.color="white";
msg.innerText="Signing in...";

const res = await fetch(api + "/auth/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({email,password})
});

const data = await res.json();

if(data.token){

localStorage.setItem("token",data.token);

msg.style.color="#7CFC00";
msg.innerText="Login Successful";

setTimeout(()=>{
window.location="index.html";
},1200);

}else{

msg.style.color="#ff4d4d";
msg.innerText=data.message || "Invalid Credentials";

}

}catch(error){

msg.style.color="#ff4d4d";
msg.innerText="Server error. Try again.";

}

}

</script>

</body>
</html>
